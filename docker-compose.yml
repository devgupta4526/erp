name: businessos

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-node: &node
  image: businessos-web:${BUSINESSOS_IMAGE_TAG:-local}
  build: .
  environment:
    DATABASE_URL: postgresql://businessos:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/businessos
    APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
    SECURE_COOKIES: ${SECURE_COOKIES:-true}
  networks:
    - database
  logging: *logging
  init: true
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: businessos
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      BUSINESSOS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/initialize.sh:/docker-entrypoint-initdb.d/10-businessos.sh:ro
    networks:
      - database
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "businessos"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  migrate:
    <<: *node
    command: ["npm", "run", "migrate"]
    depends_on:
      db:
        condition: service_healthy
  app:
    <<: *node
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

networks:
  database:
    internal: true
  edge:

volumes:
  postgres_data:
